# SpotShare — production deployment.
# Everything is env-driven: copy .env.example to .env and fill in the secrets.
#
#   cp .env.example .env   # then edit: DB_PASSWORD, JWT_SECRET, APP_CORS_ALLOWED_ORIGINS
#   docker compose -f docker-compose.prod.yml up -d --build
#
# This file is a starting point for a single small host (e.g. a $6–12/mo VPS
# or a container platform). For a managed database, point DB_HOST at it and
# drop the `db` service.

services:
  db:
    # PostGIS is required: parking_spaces stores a generated geography point
    # and search uses ST_DWithin. A plain Postgres image is NOT enough.
    image: postgis/postgis:16-3.4
    container_name: spotshare-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-spotshare}
      POSTGRES_PASSWORD: <redacted>
      POSTGRES_DB: ${DB_NAME:-spotshare}
    volumes:
      - spotshare-pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spotshare} -d ${DB_NAME:-spotshare}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: spotshare-api-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-spotshare}
      DB_USER: ${DB_USER:-spotshare}
      DB_PASSWORD: <redacted>
      # Appended verbatim to the JDBC URL for managed DBs, e.g. ?sslmode=require
      DB_URL_PARAMS: ${DB_URL_PARAMS:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for the prod profile}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-SpotShare/1.0}
    expose:
      - "8080"
    healthcheck:
      # Spring Actuator; permitted without auth in SecurityConfig.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same-origin default: nginx proxies /api/v1 to the api service.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: spotshare-web-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  spotshare-pgdata-prod:
