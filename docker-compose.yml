# Phase 1: database only. The backend runs via Maven and the frontend via npm;
# the API container is built by backend/Dockerfile for later phases.
# Copy ../.env.example to ../.env and set DB_PASSWORD first.

services:
  db:
    # PostGIS image: the V2 migration (Phase 2) enables the extension for the
    # generated geography point on parking_spaces; geographic search (Phase 4)
    # reads it.
    image: postgis/postgis:15-3.4
    container_name: spotshare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-spotshare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-spotshare}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - spotshare-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spotshare} -d ${DB_NAME:-spotshare}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spotshare-pgdata:
