# Local development stack: Postgres 15 + the SpotShare API.
# Copy ../.env.example to ../.env and fill in the secrets first.

services:
  db:
    image: postgres:15
    container_name: spotshare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-spotshare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-spotshare}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - spotshare-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spotshare} -d ${DB_NAME:-spotshare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: ./backend/Dockerfile
    container_name: spotshare-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      PORT: 8080
    ports:
      - "${PORT:-8080}:8080"

volumes:
  spotshare-pgdata:
