# SpotShare frontend: serves the Vite build and proxies API calls to the
# backend container, so the browser stays same-origin (no CORS needed when
# VITE_API_BASE_URL is left at its default /api/v1).
upstream spotshare_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: cache aggressively; Vite emits content-hashed filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API: proxy to the backend container (strip nothing; the API serves /api/v1).
    location /api/ {
        proxy_pass http://spotshare_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback: everything else serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML shell, so deploys pick up new bundles.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
