# SpotShare API — env-driven configuration.
# Every deploy-time value comes from an environment variable (see .env.example).
# Defaults are for local development only; production sets them explicitly.

server:
  port: ${PORT:8080}

spring:
  application:
    name: spotshare
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:spotshare}${DB_URL_PARAMS:}
    username: ${DB_USER:spotshare}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  cors:
    # Comma-separated frontend origins, e.g. http://localhost:5173
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # MUST be a long random value in production. Generate with: openssl rand -base64 48
    # The prod profile refuses to boot when this is blank (see ProdSecurityCheck).
    secret: ${JWT_SECRET:}
    access-token-minutes: 15
    refresh-token-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
